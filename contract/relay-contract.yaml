# =============================================================================
# Relay Agentic Framework — THE contract.
#
# This file is the ONLY definition of roles, planes, edges, message types and
# per-type payload schemas. Everything else is generated from it or validates
# against it at runtime:
#   - publisher.py validates edge + type + payload before every XADD
#   - consumers re-validate on read; off-contract input goes to the DLQ
#   - `relay contract gen` emits Pydantic models + docs (drift-tested in CI)
#   - every envelope carries the sha256 of this file (canonicalized) so two
#     machines can never silently run different rules
#
# An edge is permitted iff it is listed here. A type is permitted on an edge
# iff it is listed on that edge. A payload is permitted iff it validates
# against its type's schema. There is no second place for any of this.
# =============================================================================
contract_version: 1

roles:
  # planner is a headless worker like the analyst: the Owner never opens a
  # separate session for it. Planning happens in `relay chat` — the planner
  # drafts, the interpreter presents, feedback is relayed, and approval
  # commits the plan. One conversation is the whole owner surface.
  assistants: [interpreter, planner, analyst, specifier, builder, reviewer, qa, security]
  humans: [owner]
  infra: [coordinator, toolgate, system]

planes: [chat, plan, work, gate, run, control, system]

# Shared schema definitions, injected as $defs into every payload schema.
defs:
  IterationId: { type: string, pattern: "^I[0-9]+$" }
  StoryId: { type: string, pattern: "^I[0-9]+\\.S[0-9]+$" }
  BehaviourId: { type: string, pattern: "^I[0-9]+\\.(S[0-9]+\\.(B[0-9]+|CHAR[0-9]+|INT)|INT)$" }
  GitSha: { type: string, pattern: "^[0-9a-f]{40}$" }
  EventId: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{26}$" }   # ULID
  RunId: { type: string, pattern: "^run-[0-9A-HJKMNP-TV-Z]{26}$" }
  GateId: { type: string, pattern: "^gate-[0-9A-HJKMNP-TV-Z]{26}$" }
  QuestionId: { type: string, pattern: "^q-[0-9A-HJKMNP-TV-Z]{26}$" }
  Role:
    type: string
    enum: [owner, interpreter, planner, analyst, specifier, builder, reviewer, qa, security, coordinator, toolgate]
  BehaviourKind: { type: string, enum: [ac, integration, characterization] }
  GateName: { type: string, enum: [code_review, test_design, mutation, security, checkpoint, open_pr] }
  Severity: { type: string, enum: [blocker, major, minor, nit] }
  Finding:
    type: object
    required: [title, detail]
    additionalProperties: false
    properties:
      severity: { $ref: "#/$defs/Severity" }
      title: { type: string, maxLength: 200 }
      detail: { type: string }
      file: { type: string }
      line: { type: integer, minimum: 1 }
      source: { $ref: "#/$defs/Role" }
  Story:
    type: object
    required: [id, title, narrative, acceptance_criteria]
    additionalProperties: false
    properties:
      id: { $ref: "#/$defs/StoryId" }
      title: { type: string, maxLength: 200 }
      narrative: { type: string }          # As a / I want / So that
      acceptance_criteria:
        type: array
        minItems: 1
        items:
          type: object
          required: [id, text]
          additionalProperties: false
          properties:
            id: { $ref: "#/$defs/BehaviourId" }
            text: { type: string }         # Given/When/Then
            title: { type: string, maxLength: 80 }   # the outcome, in a few words
      priority: { type: integer, minimum: 1 }
      risk: { type: string, enum: [low, medium, high] }
      size: { type: string, enum: [XS, S, M, L] }
  Roadmap:
    type: object
    required: [iterations]
    additionalProperties: false
    properties:
      iterations:
        type: array
        minItems: 1
        items:
          type: object
          required: [id, goal, increment, stories]
          additionalProperties: false
          properties:
            id: { $ref: "#/$defs/IterationId" }
            goal: { type: string }
            increment: { type: string }    # what is demonstrable/shippable at the end
            stories: { type: array, minItems: 1, items: { $ref: "#/$defs/Story" } }
      assumptions: { type: array, items: { type: string } }

# -----------------------------------------------------------------------------
# Edges. Key = "from>to". Wildcard "*assistant" expands to every assistant
# role; "*" (only valid as a source, only on the system plane) expands to
# every role. Expansion happens once, at load time.
# -----------------------------------------------------------------------------
edges:
  chat:
    owner>interpreter: [problem.stated, answers.given, decision.made, feedback.given, instruction.given]
    interpreter>owner: [questions.asked, roadmap.proposed, checkpoint.reached, pr.announced, update.shared]
    coordinator>owner: [progress.reported]     # machine-generated status; conversation stays interpreter-only
  plan:
    interpreter>coordinator: [roadmap.committed, iteration.started, iteration.aborted, pr.approved,
                              decision.made]
    coordinator>interpreter: [story.completed, iteration.finished, stall.detected, roadmap.rejected, decision.requested, pr.opened]
    coordinator>planner: [plan.requested]
    planner>interpreter: [plan.drafted]
    interpreter>planner: [feedback.relayed, plan.approved]
    planner>coordinator: [plan.committed, error.raised]
  work:
    interpreter>analyst: [analysis.requested, answers.relayed]
    analyst>interpreter: [questions.raised, recon.completed, stories.written]
    coordinator>analyst: [recon.requested]
    coordinator>specifier: [spec.requested, judgement.requested, rework.requested]
    specifier>coordinator: [spec.written, spec.satisfied, acceptance.judged, error.raised]
    coordinator>builder: [build.requested, rework.requested, scaffold.requested]
    builder>coordinator: [behaviour.built, scaffold.completed, error.raised]
  gate:
    coordinator>reviewer: [gate.requested]
    coordinator>qa: [gate.requested]
    coordinator>security: [gate.requested]
    reviewer>coordinator: [gate.judged]
    qa>coordinator: [gate.judged]
    security>coordinator: [gate.judged]
  run:
    coordinator>toolgate: [run.requested]
    toolgate>coordinator: [run.completed]
  control:
    coordinator>*assistant: [pause.ordered, resume.ordered]
  system:
    "*>system": [worker.started, worker.stopped, worker.failed,
                 message.quarantined, gap.detected, session.started,
                 contract.upgraded, usage.reported]

# -----------------------------------------------------------------------------
# Message types. One entry per type; payload_schema is JSON Schema (2020-12).
# The loader injects `defs` above as $defs into every schema.
# -----------------------------------------------------------------------------
message_types:

  # ── chat ────────────────────────────────────────────────────────────────────
  problem.stated:
    payload_schema:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1 }

  questions.asked:
    payload_schema:
      type: object
      required: [question_id, questions]
      additionalProperties: false
      properties:
        question_id: { $ref: "#/$defs/QuestionId" }
        questions:
          type: array
          minItems: 1
          items:
            type: object
            required: [text]
            additionalProperties: false
            properties:
              text: { type: string }
              options: { type: array, items: { type: string } }
              recommended: { type: string }

  answers.given:
    payload_schema:
      type: object
      required: [question_id, answers]
      additionalProperties: false
      properties:
        question_id: { $ref: "#/$defs/QuestionId" }
        answers: { type: array, minItems: 1, items: { type: string } }

  decision.made:
    payload_schema:
      type: object
      required: [gate_id, decision]
      additionalProperties: false
      properties:
        gate_id: { $ref: "#/$defs/GateId" }
        # approve/reject answer a gate; retry/drop/fix answer an escalation —
        # without them BLOCKED is a one-way door. `fix` turns the escalation's
        # findings into rework so the gate re-runs on CHANGED code; `retry`
        # re-runs as-is (transient failures); `drop` is the Owner's waiver.
        decision: { type: string, enum: [approve, reject, retry, drop, fix] }
        subject_id: { type: string }
        comment: { type: string }

  feedback.given:
    payload_schema:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1 }
        subject_id: { type: string }

  instruction.given:
    payload_schema:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1 }

  roadmap.proposed:
    payload_schema:
      type: object
      required: [roadmap, narrative, gate_id]
      additionalProperties: false
      properties:
        roadmap: { $ref: "#/$defs/Roadmap" }
        narrative: { type: string }
        gate_id: { $ref: "#/$defs/GateId" }   # the Owner's decision.made cites this

  checkpoint.reached:
    payload_schema:
      type: object
      required: [kind, subject_id, gate_id, summary]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [story, iteration] }
        subject_id: { type: string }
        gate_id: { $ref: "#/$defs/GateId" }
        summary: { type: string }
        how_to_try: { type: string, maxLength: 600 }   # the Owner tests before deciding

  pr.announced:
    payload_schema:
      type: object
      required: [iteration_id, pr_url]
      additionalProperties: false
      properties:
        iteration_id: { $ref: "#/$defs/IterationId" }
        pr_url: { type: string, pattern: "^https://" }

  update.shared:
    payload_schema:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string }

  progress.reported:
    payload_schema:
      type: object
      required: [iteration_id, behaviours_done, behaviours_total]
      additionalProperties: false
      properties:
        iteration_id: { $ref: "#/$defs/IterationId" }
        behaviours_done: { type: integer, minimum: 0 }
        behaviours_total: { type: integer, minimum: 0 }
        current: { type: string }
        blockers: { type: array, items: { type: string } }

  # ── plan ────────────────────────────────────────────────────────────────────
  roadmap.committed:
    payload_schema:
      type: object
      required: [roadmap, intake]
      additionalProperties: false
      properties:
        roadmap: { $ref: "#/$defs/Roadmap" }
        intake:
          type: object
          required: [mode]
          additionalProperties: false
          properties:
            mode: { type: string, enum: [greenfield, legacy] }

  iteration.started:
    payload_schema:
      type: object
      required: [iteration_id]
      additionalProperties: false
      properties:
        iteration_id: { $ref: "#/$defs/IterationId" }

  iteration.aborted:
    payload_schema:
      type: object
      required: [iteration_id, reason]
      additionalProperties: false
      properties:
        iteration_id: { $ref: "#/$defs/IterationId" }
        reason: { type: string }

  pr.approved:
    payload_schema:
      type: object
      required: [iteration_id, gate_id]
      additionalProperties: false
      properties:
        iteration_id: { $ref: "#/$defs/IterationId" }
        gate_id: { $ref: "#/$defs/GateId" }

  story.completed:
    payload_schema:
      type: object
      required: [story_id, summary]
      additionalProperties: false
      properties:
        story_id: { $ref: "#/$defs/StoryId" }
        summary: { type: string }
        # a story is a vertical slice or it is not a story: the Owner checks
        # at the end of EVERY story, not only at the end of an iteration
        how_to_try: { type: string, maxLength: 600 }

  iteration.finished:
    payload_schema:
      type: object
      required: [iteration_id, summary]
      additionalProperties: false
      properties:
        iteration_id: { $ref: "#/$defs/IterationId" }
        summary: { type: string }
        how_to_try: { type: string, maxLength: 600 }

  plan.requested:
    payload_schema:
      type: object
      required: [iteration_id]
      additionalProperties: false
      properties:
        iteration_id: { $ref: "#/$defs/IterationId" }
        goal: { type: string }
        increment: { type: string }
        story_titles: { type: array, items: { type: string } }

  # The planner's draft, presented to the Owner BY THE INTERPRETER in the one
  # chat conversation. Carrying the full markdown here is deliberate: the
  # interpreter must never paraphrase what the human is approving.
  plan.drafted:
    payload_schema:
      type: object
      required: [iteration_id, summary, plan_markdown]
      additionalProperties: false
      properties:
        iteration_id: { $ref: "#/$defs/IterationId" }
        summary: { type: string, maxLength: 2000 }
        plan_markdown: { type: string, maxLength: 40000 }
        open_questions: { type: array, items: { type: string } }

  feedback.relayed:
    payload_schema:
      type: object
      required: [iteration_id, text]
      additionalProperties: false
      properties:
        iteration_id: { $ref: "#/$defs/IterationId" }
        text: { type: string, minLength: 1 }

  # The human said yes, in their own words, relayed as a first-class event:
  # only after this may the planner commit the plan and publish plan.committed.
  plan.approved:
    payload_schema:
      type: object
      required: [iteration_id]
      additionalProperties: false
      properties:
        iteration_id: { $ref: "#/$defs/IterationId" }

  plan.committed:
    payload_schema:
      type: object
      required: [iteration_id, plan_path, summary]
      additionalProperties: false
      properties:
        iteration_id: { $ref: "#/$defs/IterationId" }
        plan_path: { type: string }          # committed in the repo, e.g. docs/relay/plans/I2.md
        summary: { type: string, maxLength: 2000 }
        commit_sha: { $ref: "#/$defs/GitSha" }
        # How this iteration's code is exercised: the toolchain is a technical
        # decision, so it is made where every other technical decision is made
        # — in the change plan the human approved — and it rides the ledger
        # from there. Not in an untracked config file that no gate reads and
        # that a running worker only notices if someone restarts it.
        commands:
          type: object
          additionalProperties: { type: string }
          propertyNames:
            enum: [acceptance_test, suite, mutation, properties, setup]

  stall.detected:
    payload_schema:
      type: object
      required: [subject_id, waiting_on, since_ts]
      additionalProperties: false
      properties:
        subject_id: { type: string }
        waiting_on: { $ref: "#/$defs/Role" }
        since_ts: { type: string, format: date-time }

  roadmap.rejected:
    payload_schema:
      type: object
      required: [reasons]
      additionalProperties: false
      properties:
        reasons: { type: array, minItems: 1, items: { type: string } }

  pr.opened:
    payload_schema:
      type: object
      required: [iteration_id, pr_url]
      additionalProperties: false
      properties:
        iteration_id: { $ref: "#/$defs/IterationId" }
        pr_url: { type: string, pattern: "^https://" }

  decision.requested:
    payload_schema:
      type: object
      required: [gate_id, subject_id, reason]
      additionalProperties: false
      properties:
        gate_id: { $ref: "#/$defs/GateId" }
        subject_id: { type: string }
        reason: { type: string }
        options: { type: array, items: { type: string } }
        source_event_id: { $ref: "#/$defs/EventId" }   # the error this escalates (dedup on replay)

  # ── work ────────────────────────────────────────────────────────────────────
  analysis.requested:
    payload_schema:
      type: object
      required: [problem]
      additionalProperties: false
      properties:
        problem: { type: string, minLength: 1 }
        codebase_brief_path: { type: string }

  questions.raised:
    payload_schema:
      type: object
      required: [question_id, questions]
      additionalProperties: false
      properties:
        question_id: { $ref: "#/$defs/QuestionId" }
        questions: { type: array, minItems: 1, items: { type: string } }

  answers.relayed:
    payload_schema:
      type: object
      required: [question_id, answers]
      additionalProperties: false
      properties:
        question_id: { $ref: "#/$defs/QuestionId" }
        answers: { type: array, minItems: 1, items: { type: string } }

  recon.requested:
    payload_schema:
      type: object
      required: [commit_sha]
      additionalProperties: false
      properties:
        commit_sha: { $ref: "#/$defs/GitSha" }

  recon.completed:
    payload_schema:
      type: object
      required: [brief_path, risk_areas]
      additionalProperties: false
      properties:
        brief_path: { type: string }
        hotspots: { type: array, items: { type: string } }
        risk_areas: { type: array, items: { type: string } }
        coverage_summary: { type: string }

  stories.written:
    payload_schema:
      type: object
      required: [stories]
      additionalProperties: false
      properties:
        stories:
          type: array
          minItems: 1
          items:
            type: object
            required: [title, narrative, acceptance_criteria]
            additionalProperties: false
            properties:
              title: { type: string }
              narrative: { type: string }
              acceptance_criteria: { type: array, minItems: 1, items: { type: string } }
              priority: { type: integer, minimum: 1 }
              risk: { type: string, enum: [low, medium, high] }
              size: { type: string, enum: [XS, S, M, L] }

  spec.requested:
    payload_schema:
      type: object
      required: [behaviour_id, iteration_id, ac_text, kind, base_sha]
      additionalProperties: false
      properties:
        # story granularity: every criterion of the story in ONE request, so
        # the specifier explores the codebase once instead of once per
        # behaviour. behaviour_id/ac_text/kind describe the first of them; the
        # specifier still publishes one spec.written per behaviour.
        criteria:
          type: array
          minItems: 1
          items:
            type: object
            required: [behaviour_id, ac_text, kind]
            additionalProperties: false
            properties:
              behaviour_id: { $ref: "#/$defs/BehaviourId" }
              ac_text: { type: string }
              kind: { $ref: "#/$defs/BehaviourKind" }
        behaviour_id: { $ref: "#/$defs/BehaviourId" }
        story_id: { $ref: "#/$defs/StoryId" }
        iteration_id: { $ref: "#/$defs/IterationId" }
        ac_text: { type: string }
        kind: { $ref: "#/$defs/BehaviourKind" }
        base_sha: { $ref: "#/$defs/GitSha" }

  spec.written:
    payload_schema:
      type: object
      required: [behaviour_id, test_paths, commit_sha, touches]
      additionalProperties: false
      properties:
        behaviour_id: { $ref: "#/$defs/BehaviourId" }
        test_paths: { type: array, minItems: 1, items: { type: string } }
        commit_sha: { $ref: "#/$defs/GitSha" }
        touches: { type: array, items: { type: string } }

  # The criterion already holds against current code: the specifier commits
  # the (passing) test as a permanent guard and declares the fact. The
  # toolgate independently verifies green before the behaviour completes.
  spec.satisfied:
    payload_schema:
      type: object
      required: [behaviour_id, test_paths, commit_sha, reason]
      additionalProperties: false
      properties:
        behaviour_id: { $ref: "#/$defs/BehaviourId" }
        test_paths: { type: array, minItems: 1, items: { type: string } }
        commit_sha: { $ref: "#/$defs/GitSha" }
        reason: { type: string, maxLength: 1000 }

  judgement.requested:
    payload_schema:
      type: object
      required: [behaviour_id, commit_sha, run_id]
      additionalProperties: false
      properties:
        behaviour_id: { $ref: "#/$defs/BehaviourId" }
        commit_sha: { $ref: "#/$defs/GitSha" }
        run_id: { $ref: "#/$defs/RunId" }

  acceptance.judged:
    payload_schema:
      type: object
      required: [behaviour_id, verdict, run_id]
      additionalProperties: false
      properties:
        behaviour_id: { $ref: "#/$defs/BehaviourId" }
        verdict: { type: string, enum: [pass, fail] }
        run_id: { $ref: "#/$defs/RunId" }
        reason: { type: string }

  # Greenfield bootstrap: the plan proposed a stack, but a from-scratch repo
  # has nothing for the setup command to install into. The builder initialises
  # the project (manifest, lockfile, test-runner config, layout) and commits —
  # then the toolchain proof re-runs. Work must never stop before the first
  # behaviour because the workshop assumed a project that does not exist yet.
  scaffold.requested:
    payload_schema:
      type: object
      required: [iteration_id, detail]
      additionalProperties: false
      properties:
        iteration_id: { $ref: "#/$defs/IterationId" }
        detail: { type: string }     # what the setup proof said, verbatim

  scaffold.completed:
    payload_schema:
      type: object
      required: [iteration_id, commit_sha]
      additionalProperties: false
      properties:
        iteration_id: { $ref: "#/$defs/IterationId" }
        commit_sha: { $ref: "#/$defs/GitSha" }
        summary: { type: string, maxLength: 1000 }

  build.requested:
    payload_schema:
      type: object
      required: [behaviour_id, spec_commit_sha, test_paths]
      additionalProperties: false
      properties:
        # story granularity: all of the story's red tests in ONE request. The
        # builder still works behaviour by behaviour and publishes one
        # behaviour.built each — the discipline is unchanged, the context is
        # acquired once.
        behaviours:
          type: array
          minItems: 1
          items:
            type: object
            required: [behaviour_id, test_paths]
            additionalProperties: false
            properties:
              behaviour_id: { $ref: "#/$defs/BehaviourId" }
              test_paths: { type: array, items: { type: string } }
        behaviour_id: { $ref: "#/$defs/BehaviourId" }
        spec_commit_sha: { $ref: "#/$defs/GitSha" }
        test_paths: { type: array, minItems: 1, items: { type: string } }
        instructions: { type: array, items: { type: string } }

  rework.requested:
    payload_schema:
      type: object
      required: [behaviour_id, attempt, findings]
      additionalProperties: false
      properties:
        behaviour_id: { $ref: "#/$defs/BehaviourId" }
        attempt: { type: integer, minimum: 2 }
        findings: { type: array, minItems: 1, items: { $ref: "#/$defs/Finding" } }

  behaviour.built:
    payload_schema:
      type: object
      required: [behaviour_id, story_id, iteration_id, commit_sha, attempt]
      additionalProperties: false
      properties:
        behaviour_id: { $ref: "#/$defs/BehaviourId" }
        story_id:
          oneOf: [{ $ref: "#/$defs/StoryId" }, { type: "null" }]   # null for INT behaviours
        iteration_id: { $ref: "#/$defs/IterationId" }
        commit_sha: { $ref: "#/$defs/GitSha" }
        attempt: { type: integer, minimum: 1 }
        summary: { type: string, maxLength: 2000 }
        how_to_run: { type: string, maxLength: 600 }   # exact commands a human runs to try it

  error.raised:
    payload_schema:
      type: object
      required: [kind, detail]
      additionalProperties: false
      properties:
        behaviour_id: { $ref: "#/$defs/BehaviourId" }
        # `spec_conflict`: an EXISTING acceptance test now contradicts this
        # behaviour. Only the specifier may change tests, so this routes there
        # as rework rather than escalating a question the Owner cannot answer.
        kind: { type: string, enum: [push_conflict, sha_unavailable, tool_failure, blocked,
                                     spec_conflict, other] }
        detail: { type: string }

  # ── gate ────────────────────────────────────────────────────────────────────
  gate.requested:
    payload_schema:
      type: object
      required: [gate_id, gate, subject_kind, subject_id, commit_sha, base_sha]
      additionalProperties: false
      properties:
        gate_id: { $ref: "#/$defs/GateId" }
        gate: { $ref: "#/$defs/GateName" }
        subject_kind: { type: string, enum: [behaviour, story, iteration] }
        subject_id: { type: string }
        commit_sha: { $ref: "#/$defs/GitSha" }
        base_sha: { $ref: "#/$defs/GitSha" }
        run_id: { $ref: "#/$defs/RunId" }    # e.g. the mutation tool run qa must judge
        # findings from earlier runs of this gate on this subject that are
        # still open: the verdict must disposition every one of them
        prior_findings: { type: array, items: { $ref: "#/$defs/Finding" } }

  gate.judged:
    payload_schema:
      type: object
      required: [gate_id, verdict, findings]
      additionalProperties: false
      properties:
        gate_id: { $ref: "#/$defs/GateId" }
        verdict: { type: string, enum: [pass, fail] }
        findings: { type: array, items: { $ref: "#/$defs/Finding" } }
        score: { type: number }             # e.g. Farley Index, security score
        run_id: { $ref: "#/$defs/RunId" }
        # After a fail, the burden of proof is on the pass: each prior finding
        # must be dispositioned by exact title — `fixed` (cite the fixing
        # commit; mechanically rejected if the code did not change) or
        # `false_positive` (justify, on the record). A pass with missing or
        # invalid dispositions is CONTESTED, never silently accepted.
        dispositions:
          type: array
          items:
            type: object
            required: [title, disposition]
            additionalProperties: false
            properties:
              title: { type: string, maxLength: 200 }
              disposition: { type: string, enum: [fixed, false_positive] }
              commit_sha: { $ref: "#/$defs/GitSha" }
              justification: { type: string, maxLength: 1000 }

  # ── run ─────────────────────────────────────────────────────────────────────
  run.requested:
    payload_schema:
      type: object
      required: [run_id, kind, commit_sha]
      additionalProperties: false
      properties:
        run_id: { $ref: "#/$defs/RunId" }
        kind: { type: string, enum: [acceptance_test, suite, mutation, properties, command, setup] }
        commit_sha: { $ref: "#/$defs/GitSha" }
        test_paths: { type: array, items: { type: string } }
        command: { type: string }
        # bootstrap for the pinned worktree (npm ci, uv sync, ...): runs before
        # `command`; a non-zero exit is a setup_failed FAULT, never a red test
        setup_command: { type: string }
        behaviour_id: { $ref: "#/$defs/BehaviourId" }

  run.completed:
    payload_schema:
      type: object
      required: [run_id, kind, commit_sha, exit_code, duration_s, output_digest]
      additionalProperties: false
      properties:
        run_id: { $ref: "#/$defs/RunId" }
        kind: { type: string, enum: [acceptance_test, suite, mutation, properties, command, setup] }
        commit_sha: { $ref: "#/$defs/GitSha" }
        exit_code: { type: integer }
        duration_s: { type: number, minimum: 0 }
        output_digest: { type: string }      # sha256 of captured output
        artifact_path: { type: string }      # where full output is stored
        summary: { type: string, maxLength: 2000 }
        # THE COMMAND DID NOT RUN. Absent means the exit code is evidence about
        # the code; present means it is evidence about the machine, and the
        # coordinator must refuse to read red or green into it. A red
        # verification once "passed" because `uv run pytest` was missing from a
        # Rust project — a non-zero exit that proved nothing at all.
        fault:
          type: string
          enum: [not_executable, no_command, missing_commit, timeout, missing_dependency, setup_failed]

  # ── control ─────────────────────────────────────────────────────────────────
  pause.ordered:
    payload_schema:
      type: object
      required: [role, reason]
      additionalProperties: false
      properties:
        role: { $ref: "#/$defs/Role" }
        reason: { type: string }

  resume.ordered:
    payload_schema:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: "#/$defs/Role" }
        reason: { type: string }

  # ── system ──────────────────────────────────────────────────────────────────
  worker.started:
    payload_schema:
      type: object
      required: [role, host, pid, worker_version, contract_hash]
      additionalProperties: false
      properties:
        role: { $ref: "#/$defs/Role" }
        host: { type: string }
        pid: { type: integer, minimum: 1 }
        worker_version: { type: string }
        contract_hash: { type: string, pattern: "^[0-9a-f]{64}$" }

  worker.stopped:
    payload_schema:
      type: object
      required: [role, host, pid]
      additionalProperties: false
      properties:
        role: { $ref: "#/$defs/Role" }
        host: { type: string }
        pid: { type: integer, minimum: 1 }

  worker.failed:
    payload_schema:
      type: object
      required: [role, kind, detail]
      additionalProperties: false
      properties:
        role: { $ref: "#/$defs/Role" }
        kind: { type: string, enum: [snapshot_mismatch, contract_drift, runner_failure, redis_failure, other] }
        detail: { type: string }

  message.quarantined:
    payload_schema:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        original_event_id: { $ref: "#/$defs/EventId" }
        reason: { type: string, enum: [off_contract, delivery_cap_exceeded, contract_drift, unparseable, superseded] }
        detail: { type: string }

  gap.detected:
    payload_schema:
      type: object
      required: [expected_seq, observed_seq]
      additionalProperties: false
      properties:
        expected_seq: { type: integer, minimum: 1 }
        observed_seq: { type: integer, minimum: 1 }

  session.started:
    payload_schema:
      type: object
      required: [role, session_ref]
      additionalProperties: false
      properties:
        role: { $ref: "#/$defs/Role" }
        session_ref: { type: string }

  contract.upgraded:
    payload_schema:
      type: object
      required: [old_hash, new_hash]
      additionalProperties: false
      properties:
        old_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        new_hash: { type: string, pattern: "^[0-9a-f]{64}$" }

  # One model turn's billable footprint. The envelope refs attach it to the
  # work item, so cost per behaviour/gate/iteration is a fold like everything
  # else that is true (D3) — and it outlives the session transcripts, which
  # live outside the swarm and are destroyed with it.
  #   model         the tier that ACTUALLY billed, not the one configured
  #   fresh_session cold start (rotation paid full price) or resumed
  #   agent_turns   loops the invocation spent, i.e. how much it rediscovered
  usage.reported:
    payload_schema:
      type: object
      required: [role, model, trigger_type, fresh_session]
      additionalProperties: false
      properties:
        role: { $ref: "#/$defs/Role" }
        model: { type: string, minLength: 1 }
        trigger_type: { type: string, minLength: 1 }
        fresh_session: { type: boolean }
        session_turn: { type: integer, minimum: 1 }
        agent_turns: { type: integer, minimum: 0 }
        duration_s: { type: number, minimum: 0 }
        cost_usd: { type: number, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        cache_creation_input_tokens: { type: integer, minimum: 0 }
        cache_read_input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
