# Gate policy (project copy lives at <project>/.relay/gates.yaml — edit that).
# The specifier's acceptance judgement is always mandatory and is not a policy
# entry. No timeout ever auto-approves; human gates never expire.

per_behaviour:
  - { gate: code_review, role: reviewer, timeout_s: 1800, retries: 1 }
  - { gate: test_design, role: qa,       timeout_s: 1800, retries: 1 }

# Mutation testing needs a project mutation command — uncomment after adding
# `mutation = "<your mutation tool>"` under [commands] in relay.toml:
# per_story:
#   - { gate: mutation,    role: qa,       timeout_s: 3600, retries: 1 }
per_story: []

per_iteration:
  - { gate: security,    role: security, timeout_s: 3600, retries: 1 }

wip_limit: 1
max_attempts: 3
