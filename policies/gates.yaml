# Gate policy (project copy lives at <project>/.relay/gates.yaml — edit that).
# The specifier's acceptance judgement is always mandatory and is not a policy
# entry. No timeout ever auto-approves; human gates never expire.

per_behaviour:
  - { gate: code_review, role: reviewer, timeout_s: 1800, retries: 1 }
  - { gate: test_design, role: qa,       timeout_s: 1800, retries: 1 }

# Mutation testing needs a project mutation command — uncomment after adding
# `mutation = "<your mutation tool>"` under [commands] in relay.toml:
# per_story:
#   - { gate: mutation,    role: qa,       timeout_s: 3600, retries: 1 }
per_story: []

per_iteration:
  - { gate: security,    role: security, timeout_s: 3600, retries: 1 }

wip_limit: 1
max_attempts: 3

# Plan mode: no behaviour is dispatched for an iteration until an
# Owner-approved change plan (authored in `relay plan`) is committed as
# docs/relay/plans/<iteration>.md and announced on the bus. Fail closed.
plan_required: true

# Deadline supervision: anything dispatched and unanswered past this many
# seconds is re-dispatched once, then escalated to the Owner (never dropped,
# never auto-approved). Open Owner decisions are re-asked every
# decision_nudge_s, forever — waiting on a human is supervised exactly like
# waiting on a worker.
dispatch_timeout_s: 2700
decision_nudge_s: 1800

# How much work goes into ONE model transaction. `story` hands the specifier a
# whole story to write tests for, and the builder that story's red tests, so
# the codebase is explored once instead of once per behaviour — measured at
# ~34k of fixed setup per turn before any thinking. The discipline is
# unchanged: one failing test per criterion, one commit per behaviour, gates on
# the diff, and the builder still never grades its own homework.
# Set both to `behaviour` to go back to a transaction per slice.
spec_granularity: story
build_granularity: story
